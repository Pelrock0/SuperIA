<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-effect {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.7);
        }
        .ambient-shadow {
            box-shadow: 0px 24px 48px -12px rgba(0, 39, 54, 0.08);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary-fixed-dim": "#9ecde8",
                      "secondary": "#00677d",
                      "on-primary-fixed": "#001e2b",
                      "on-secondary-container": "#005c70",
                      "primary-container": "#003e54",
                      "on-primary-fixed-variant": "#174c62",
                      "error": "#ba1a1a",
                      "tertiary-container": "#00422b",
                      "outline": "#71787d",
                      "on-secondary": "#ffffff",
                      "surface-variant": "#e0e3e5",
                      "on-primary": "#ffffff",
                      "surface-container-high": "#e6e8ea",
                      "surface-container-low": "#f2f4f6",
                      "on-tertiary-fixed-variant": "#005236",
                      "on-tertiary-fixed": "#002113",
                      "on-tertiary": "#ffffff",
                      "on-error-container": "#93000a",
                      "outline-variant": "#c1c7cd",
                      "inverse-surface": "#2d3133",
                      "inverse-primary": "#9ecde8",
                      "on-secondary-fixed-variant": "#004e5f",
                      "tertiary": "#002a1a",
                      "secondary-fixed": "#b3ebff",
                      "background": "#f7f9fb",
                      "surface-tint": "#34647b",
                      "surface-bright": "#f7f9fb",
                      "on-primary-container": "#7aa9c3",
                      "inverse-on-surface": "#eff1f3",
                      "error-container": "#ffdad6",
                      "tertiary-fixed-dim": "#4edea3",
                      "primary-fixed": "#c1e8ff",
                      "on-error": "#ffffff",
                      "surface-container": "#eceef0",
                      "surface": "#f7f9fb",
                      "surface-container-highest": "#e0e3e5",
                      "on-surface-variant": "#41484c",
                      "on-surface": "#191c1e",
                      "primary": "#002736",
                      "surface-container-lowest": "#ffffff",
                      "on-background": "#191c1e",
                      "secondary-container": "#50d9fe",
                      "on-secondary-fixed": "#001f27",
                      "surface-dim": "#d8dadc",
                      "secondary-fixed-dim": "#4cd6fb",
                      "on-tertiary-container": "#10b981",
                      "tertiary-fixed": "#6ffbbe"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Inter"],
                      "body": ["Inter"],
                      "label": ["Inter"]
              }
            },
          }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-background min-h-screen flex flex-col selection:bg-tertiary-fixed selection:text-on-tertiary-fixed">
<main class="flex-grow flex items-center justify-center p-6 relative overflow-hidden">
<!-- Background decorative element -->
<div class="absolute top-[-10%] right-[-10%] w-64 h-64 bg-tertiary-fixed/20 rounded-full blur-3xl"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-80 h-80 bg-primary-fixed/30 rounded-full blur-3xl"></div>
<div class="w-full max-w-md z-10">
<!-- Brand Identity -->
<div class="flex flex-col items-center mb-10">
<div class="relative flex items-center justify-center mb-2">
<div class="flex items-baseline gap-2">
<div class="relative">
<span class="text-4xl font-extrabold text-primary-container tracking-tighter">S</span>
<div class="absolute -top-1 -right-2">
<span class="material-symbols-outlined text-on-tertiary-container text-xl" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
</div>
<h1 class="text-2xl font-bold tracking-tighter text-primary">Superia</h1>
</div>
</div>
</div>
<!-- Login Card -->
<div class="surface-container-lowest rounded-3xl p-8 ambient-shadow border border-white/40 glass-effect">
<div class="mb-8">
<h2 class="text-2xl font-bold tracking-tight text-primary mb-2">Bienvenido de nuevo</h2>
<p class="text-on-surface-variant leading-relaxed">Tu lista de compra inteligente te espera.</p>
</div>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-[10px] font-bold tracking-widest text-on-surface-variant uppercase ml-1">EMAIL</label>
<div class="relative">
<input class="w-full px-5 py-4 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary/10 text-on-surface placeholder:text-outline-variant transition-all" placeholder="ejemplo@superia.es" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block text-[10px] font-bold tracking-widest text-on-surface-variant uppercase ml-1">CONTRASEÑA</label>
<div class="relative">
<input class="w-full px-5 py-4 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary/10 text-on-surface placeholder:text-outline-variant transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 12.a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Utility Actions -->
<div class="flex items-center justify-between text-sm px-1">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center">
<input class="w-4 h-4 rounded border-outline-variant text-primary-container focus:ring-primary-container transition-all" type="checkbox"/>
</div>
<span class="text-on-surface-variant group-hover:text-primary transition-colors">Recuérdame</span>
</label>
<a class="text-primary-container font-semibold hover:underline decoration-2 underline-offset-4" href="#">Olvidé mi contraseña</a>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-on-primary py-4 rounded-xl font-bold text-base shadow-lg shadow-primary-container/20 hover:opacity-90 active:scale-[0.98] transition-all" type="submit">
                        Iniciar Sesión
                    </button>
</form>
<!-- Waitlist Notice -->
<div class="mt-10 p-5 rounded-2xl bg-tertiary-fixed/10 flex flex-col gap-3 relative overflow-hidden">
<div class="flex items-center gap-2">
<span class="text-xs font-bold uppercase tracking-widest text-on-tertiary-fixed-variant px-2 py-1 bg-tertiary-fixed rounded-lg inline-flex items-center gap-1.5">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
                            ¿No tienes cuenta?
                        </span>
</div>
<p class="text-sm text-on-tertiary-fixed-variant leading-relaxed">
                        Estás en lista de espera, te avisaremos pronto para que disfrutes de la experiencia Superia.
                    </p>
</div>
</div>
</div>
</main>
<!-- Footer Meta Links -->
<footer class="p-8 mt-auto">
<div class="flex justify-center items-center gap-8">
<a class="text-sm font-semibold text-on-surface-variant hover:text-primary transition-colors underline decoration-1 underline-offset-4" href="#">Ayuda</a>
<div class="w-1 h-1 rounded-full bg-outline-variant"></div>
<a class="text-sm font-bold text-primary flex items-center gap-1" href="#">
                ES
                <span class="material-symbols-outlined text-sm">expand_more</span>
</a>
</div>
</footer>
</body></html>
