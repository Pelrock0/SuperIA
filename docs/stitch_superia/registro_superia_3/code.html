<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#c1c7cd",
                        "surface-dim": "#d8dadc",
                        "secondary-container": "#50d9fe",
                        "tertiary": "#002a1a",
                        "on-secondary-fixed-variant": "#004e5f",
                        "inverse-surface": "#2d3133",
                        "background": "#f7f9fb",
                        "primary-container": "#003e54",
                        "tertiary-fixed": "#6ffbbe",
                        "outline": "#71787d",
                        "on-tertiary-container": "#10b981",
                        "on-secondary-fixed": "#001f27",
                        "on-primary": "#ffffff",
                        "surface-variant": "#e0e3e5",
                        "surface-container-low": "#f2f4f6",
                        "surface": "#f7f9fb",
                        "primary-fixed": "#c1e8ff",
                        "on-surface-variant": "#41484c",
                        "on-primary-fixed": "#001e2b",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "error": "#ba1a1a",
                        "surface-tint": "#34647b",
                        "surface-container-high": "#e6e8ea",
                        "primary-fixed-dim": "#9ecde8",
                        "secondary-fixed-dim": "#4cd6fb",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#7aa9c3",
                        "surface-container": "#eceef0",
                        "primary": "#002736",
                        "surface-bright": "#f7f9fb",
                        "secondary": "#00677d",
                        "on-tertiary-fixed-variant": "#005236",
                        "on-error-container": "#93000a",
                        "on-background": "#191c1e",
                        "on-surface": "#191c1e",
                        "on-error": "#ffffff",
                        "inverse-primary": "#9ecde8",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#174c62",
                        "secondary-fixed": "#b3ebff",
                        "on-tertiary-fixed": "#002113",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#eff1f3",
                        "tertiary-fixed-dim": "#4edea3",
                        "tertiary-container": "#00422b",
                        "on-secondary-container": "#005c70"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
        .glass-bg {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-[#f7f9fb] min-h-screen flex flex-col items-center justify-center p-4">
<!-- Top AppBar Suppressed due to Transactional Focus (Registration) -->
<main class="w-full max-w-md">
<!-- Brand Identity -->
<div class="flex justify-center mb-8">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center">
<svg class="w-10 h-10" fill="none" height="40" viewbox="0 0 40 40" width="40" xmlns="http://www.w3.org/2000/svg">
<!-- Stylized 'S' -->
<path d="M28 13C28 9.68629 25.3137 7 22 7H16C12.6863 7 10 9.68629 10 13C10 15.5 11.5 17.5 13.5 18.5L24.5 21.5C26.5 22.5 28 24.5 28 27C28 30.3137 25.3137 33 22 33H16C12.6863 33 10 30.3137 10 27" stroke="#003E54" stroke-linecap="round" stroke-width="4"></path>
<!-- Leaf Sprout -->
<path d="M24 7C24 4.5 26 3 28 3C28 5.5 26 7 24 7Z" fill="#10B981"></path>
<path d="M24 7C22 5.5 21 3.5 21 2C23 2 24.5 4.5 24 7Z" fill="#10B981"></path>
</svg>
</div>
<span class="text-2xl font-extrabold tracking-tight text-[#003E54]">Superia</span>
</div>
</div>
<!-- Registration Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_24px_0_rgba(0,39,54,0.06)] overflow-hidden">
<!-- Hero Decorative Image -->
<div class="h-32 w-full relative">
<img alt="Luxury Mediterranean interior" class="w-full h-full object-cover" data-alt="luxury modern mediterranean living room with soft natural sunlight hitting white walls and teal decorative accents" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA9-oNRJ-Nd_ZsRvlMCwwoVgPlxATgCrjDOl8nzrM78wzReNzWXxXSplg7D003CHcJQU3aRG1lkRd3UzhQRdAMyU3JPDLFhFuLBlgN1etpfjhZU-Orc0Sf5dTufMwgrk0vaNhRlwVzA75Yg5y7gKeUoa_dbPDqr9f6Ewb_39hy9yrwpVhJIYToK84SQbPf2uik_slZgWX12jKeSY0tLCChpk1mWdr_gSl4XsqvQmtS5OaENZKIGI2_KIgPOYo7P7PZ_5_B2G-xHbBY"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest to-transparent"></div>
</div>
<div class="px-8 pb-10 pt-4">
<div class="mb-8">
<h1 class="text-2xl font-bold tracking-tight text-primary-container mb-2">¡Te hemos reservado tu plaza!</h1>
<p class="text-on-surface-variant text-sm leading-relaxed">Crea tu cuenta y empieza a hacer la compra más inteligente.</p>
</div>
<form class="space-y-6">
<!-- Email Field (Read-only) -->
<div>
<label class="block text-[10px] font-bold uppercase tracking-wider text-on-surface-variant mb-1.5 ml-1">Email de invitación</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 text-slate-500 cursor-not-allowed focus:ring-0" readonly="" type="email" value="ejemplo@superia.es"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg" data-icon="lock">lock</span>
</div>
</div>
<!-- Name Field -->
<div>
<label class="block text-[10px] font-bold uppercase tracking-wider text-on-surface-variant mb-1.5 ml-1">Nombre</label>
<input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 text-primary focus:ring-2 focus:ring-primary/10 transition-all placeholder:text-slate-400" placeholder="Tu nombre completo" type="text"/>
</div>
<!-- Password Field & Strength -->
<div>
<label class="block text-[10px] font-bold uppercase tracking-wider text-on-surface-variant mb-1.5 ml-1">Contraseña</label>
<input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 text-primary focus:ring-2 focus:ring-primary/10 transition-all placeholder:text-slate-400" placeholder="••••••••" type="password"/>
<!-- Strength Indicator -->
<div class="mt-3 px-1">
<div class="flex justify-between items-center mb-1.5">
<span class="text-[10px] font-medium text-on-surface-variant">Seguridad de la contraseña</span>
<span class="text-[10px] font-bold text-secondary uppercase tracking-tight">Media</span>
</div>
<div class="flex gap-1.5 h-1">
<div class="flex-1 bg-secondary-container rounded-full"></div>
<div class="flex-1 bg-secondary-container rounded-full"></div>
<div class="flex-1 bg-surface-container-high rounded-full"></div>
<div class="flex-1 bg-surface-container-high rounded-full"></div>
</div>
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="block text-[10px] font-bold uppercase tracking-wider text-on-surface-variant mb-1.5 ml-1">Confirmar Contraseña</label>
<input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 text-primary focus:ring-2 focus:ring-primary/10 transition-all placeholder:text-slate-400" placeholder="••••••••" type="password"/>
</div>
<!-- Privacy Policy -->
<div class="flex items-start gap-3 pt-2">
<div class="flex items-center h-5">
<input class="w-5 h-5 rounded border-none bg-surface-container-high text-primary focus:ring-0 focus:ring-offset-0 transition-colors" id="privacy" type="checkbox"/>
</div>
<label class="text-xs text-on-surface-variant leading-normal" for="privacy">
                            Acepto la <a class="text-primary font-bold underline decoration-primary/20 hover:decoration-primary transition-all" href="#">política de privacidad</a> y los términos de servicio.
                        </label>
</div>
<!-- Submit CTA -->
<div class="pt-4">
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold py-4 px-6 rounded-xl shadow-lg shadow-primary/10 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group" type="submit">
<span>Crear mi cuenta</span>
<span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</div>
</div>
<!-- Footer Help -->
<p class="mt-8 text-center text-sm text-on-surface-variant">
            ¿Ya tienes cuenta? <a class="text-primary font-bold hover:text-primary-container transition-colors" href="#">Iniciar sesión</a>
</p>
</main>
<!-- BottomNavBar Suppressed due to Transactional Focus (Registration) -->
</body></html>
