<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Superia - Iniciar Sesión</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .glass-effect {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#34647b",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#001f27",
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#005c70",
                        "secondary-fixed-dim": "#4cd6fb",
                        "on-tertiary-container": "#10b981",
                        "on-primary-fixed-variant": "#174c62",
                        "tertiary-container": "#00422b",
                        "inverse-primary": "#9ecde8",
                        "surface-container-low": "#f2f4f6",
                        "on-primary-container": "#7aa9c3",
                        "secondary-container": "#50d9fe",
                        "primary-fixed-dim": "#9ecde8",
                        "primary-container": "#003e54",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#001e2b",
                        "on-tertiary-fixed": "#002113",
                        "on-tertiary-fixed-variant": "#005236",
                        "surface-container": "#eceef0",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "on-background": "#191c1e",
                        "surface-variant": "#e0e3e5",
                        "primary-fixed": "#c1e8ff",
                        "surface": "#f7f9fb",
                        "inverse-on-surface": "#eff1f3",
                        "tertiary-fixed-dim": "#4edea3",
                        "on-secondary-fixed-variant": "#004e5f",
                        "tertiary-fixed": "#6ffbbe",
                        "outline-variant": "#c1c7cd",
                        "inverse-surface": "#2d3133",
                        "outline": "#71787d",
                        "surface-dim": "#d8dadc",
                        "surface-container-highest": "#e0e3e5",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e6e8ea",
                        "secondary-fixed": "#b3ebff",
                        "on-surface-variant": "#41484c",
                        "on-surface": "#191c1e",
                        "background": "#f7f9fb",
                        "tertiary": "#002a1a",
                        "surface-bright": "#f7f9fb",
                        "secondary": "#00677d",
                        "on-error-container": "#93000a",
                        "primary": "#002736"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    }
                },
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center p-6 selection:bg-secondary-container">
<!-- Top Navigation (Suppressed per task context, using only Brand identity) -->
<header class="fixed top-0 w-full flex justify-center items-center h-20 px-6 z-50">
<div class=""><div class="flex items-center gap-2"><svg class="flex-shrink-0" fill="none" height="32" viewbox="0 0 32 32" width="32" xmlns="http://www.w3.org/2000/svg"><path d="M22 6C22 4.34315 20.6569 3 19 3C17.3431 3 16 4.34315 16 6C16 7.65685 17.3431 9 19 9C20.6569 9 22 7.65685 22 6Z" fill="#10B981"></path><path d="M19 8C19 8 20 6.5 20 5C20 3.5 19 3 19 3C19 3 18 3.5 18 5C18 6.5 19 8 19 8Z" fill="#10B981"></path><path d="M22.5 11.5C21.3 10.2 19.5 9.5 17.5 9.5C13.5 9.5 11.5 12.5 11.5 15C11.5 17.5 14 18 16 18.5C18.5 19.1 20.5 19.5 20.5 22.5C20.5 25.5 18 28.5 14 28.5C11.5 28.5 9.5 27.5 8.5 26.5" stroke="#003E54" stroke-linecap="round" stroke-width="3.5"></path></svg><span class="text-2xl font-extrabold tracking-tighter text-[#003E54]">Superia</span></div></div>
</header>
<main class="w-full max-w-md mt-12 mb-20">
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-[0_24px_48px_-12px_rgba(25,28,30,0.06)] border border-outline-variant/10">
<!-- Branding/Greeting -->
<div class="text-center mb-10">
<h1 class="text-3xl font-bold tracking-tight text-primary mb-2">Bienvenido de nuevo</h1>
<p class="text-on-surface-variant text-sm">Tu lista de compra inteligente te espera.</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div>
<label class="block text-[11px] font-bold uppercase tracking-[0.05em] text-on-surface-variant mb-2" for="email">Email</label>
<div class="relative group">
<input class="w-full h-12 px-4 bg-surface-container-low border-none rounded-xl text-on-surface focus:ring-2 focus:ring-secondary/20 transition-all duration-200 placeholder:text-outline" id="email" name="email" placeholder="ejemplo@superia.es" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block text-[11px] font-bold uppercase tracking-[0.05em] text-on-surface-variant mb-2" for="password">Password</label>
<div class="relative">
<input class="w-full h-12 px-4 bg-surface-container-low border-none rounded-xl text-on-surface focus:ring-2 focus:ring-secondary/20 transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary p-1" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Checkbox & Forgot Password -->
<div class="flex items-center justify-between">
<label class="flex items-center cursor-pointer group">
<div class="relative">
<input class="peer sr-only" type="checkbox"/>
<div class="w-5 h-5 bg-surface-container-low border-none rounded-md peer-checked:bg-primary-container transition-all"></div>
<span class="material-symbols-outlined absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-white text-[14px] opacity-0 peer-checked:opacity-100" data-icon="check">check</span>
</div>
<span class="ml-2 text-sm text-on-surface-variant group-hover:text-primary transition-colors">Recuérdame</span>
</label>
<a class="text-sm font-semibold text-secondary hover:underline underline-offset-4" href="#">Olvidé mi contraseña</a>
</div>
<!-- Submit CTA -->
<button class="w-full h-14 bg-gradient-to-br from-primary to-primary-container text-white font-bold rounded-xl shadow-lg shadow-primary/10 hover:shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group" type="submit">
<span>Iniciar sesión</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</div>
<!-- Waitlist / Sign up Footer -->
<div class="mt-12 text-center px-4">
<div class="inline-flex items-center gap-2 bg-tertiary-fixed/30 py-2 px-4 rounded-full border border-tertiary-fixed-dim/20">
<span class="material-symbols-outlined text-tertiary text-[16px]" data-icon="auto_awesome" data-weight="fill" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<p class="text-sm text-tertiary font-medium">¿No tienes cuenta?</p>
</div>
<p class="mt-4 text-sm text-on-surface-variant leading-relaxed">
                Estás en lista de espera, te avisaremos pronto para que disfrutes de la experiencia <span class="font-bold text-primary italic">Superia</span>.
            </p>
</div>
</main>
<!-- Background Decoration (Mediterranean Modern Elements) -->
<div class="fixed top-0 right-0 -z-10 w-[500px] h-[500px] opacity-20 pointer-events-none blur-[100px] bg-secondary-container rounded-full translate-x-1/2 -translate-y-1/2"></div>
<div class="fixed bottom-0 left-0 -z-10 w-[400px] h-[400px] opacity-10 pointer-events-none blur-[80px] bg-tertiary-fixed rounded-full -translate-x-1/2 translate-y-1/2"></div>
<!-- Bottom Info (Mimicking BottomNavBar structure but transactional styled) -->
<footer class="fixed bottom-0 w-full p-8 flex justify-center items-center pointer-events-none">
<div class="flex gap-8 pointer-events-auto">
<a class="flex flex-col items-center gap-1 group" href="#">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="help">help</span>
<span class="text-[10px] font-bold uppercase tracking-wider text-outline group-hover:text-primary">Ayuda</span>
</a>
<a class="flex flex-col items-center gap-1 group" href="#">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="language">language</span>
<span class="text-[10px] font-bold uppercase tracking-wider text-outline group-hover:text-primary">ES</span>
</a>
</div>
</footer>
</body></html>
