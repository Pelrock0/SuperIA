<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .bottom-sheet-gradient {
            background: linear-gradient(180deg, rgba(255,255,255,1) 0%, rgba(247,249,251,1) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface font-body text-on-surface antialiased overflow-hidden h-screen w-screen">
<!-- Background Content: Detalle de Lista (Blurred/Dimmed) -->
<div class="fixed inset-0 z-0 blur-sm brightness-75 transition-all duration-500">
<!-- TopAppBar Placeholder -->
<header class="bg-[#f7f9fb] text-[#002736] font-['Inter'] font-bold tracking-tight w-full top-0 sticky flex justify-between items-center px-6 py-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined">arrow_back</span>
<span class="text-2xl tracking-tighter">Compra Semanal</span>
</div>
<div class="w-8 h-8 rounded-full bg-slate-300"></div>
</header>
<main class="px-6 py-8">
<div class="mb-8">
<h2 class="text-3xl font-bold tracking-tight text-primary mb-2">Frutas y Verduras</h2>
<div class="space-y-4">
<div class="bg-surface-container-lowest p-4 rounded-2xl flex justify-between items-center">
<div class="flex gap-4 items-center">
<div class="w-12 h-12 rounded-xl bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-primary">nutrition</span>
</div>
<div>
<p class="font-bold">Plátanos de Canarias</p>
<p class="text-sm text-on-surface-variant">1 racimo • 2,30€</p>
</div>
</div>
<span class="material-symbols-outlined text-outline">check_circle</span>
</div>
</div>
</div>
</main>
</div>
<!-- Overlay / Scrim -->
<div class="fixed inset-0 bg-primary/20 backdrop-blur-[2px] z-10"></div>
<!-- Bottom Sheet Container -->
<div class="fixed bottom-0 inset-x-0 z-20 flex flex-col items-center">
<!-- Sheet Handle -->
<div class="w-12 h-1.5 bg-white/40 rounded-full mb-3"></div>
<!-- Sheet Body -->
<div class="w-full bg-surface-container-lowest rounded-t-[40px] shadow-[0_-8px_40px_-10px_rgba(0,39,54,0.15)] max-h-[795px] overflow-y-auto hide-scrollbar pb-10">
<div class="px-8 pt-10 pb-6">
<!-- 1. Item Name Input (Autofocus Style) -->
<div class="relative mb-6">
<label class="block text-[11px] font-bold uppercase tracking-[0.1em] text-primary/60 mb-2 ml-1">Producto</label>
<input class="w-full text-4xl font-extrabold tracking-tight text-primary bg-transparent border-none focus:ring-0 p-0 placeholder:text-surface-variant" placeholder="¿Qué necesitas?" type="text" value="Tomates"/>
<div class="absolute -bottom-1 left-0 right-0 h-0.5 bg-primary/5 rounded-full"></div>
</div>
<!-- 2. Autocomplete Suggestions -->
<div class="flex flex-wrap gap-2 mb-8">
<button class="flex items-center gap-2 px-4 py-2.5 bg-surface-container-low hover:bg-surface-container rounded-full transition-all group">
<span class="text-sm font-semibold text-primary">Tomates cherry</span>
<span class="text-[10px] font-bold bg-white text-secondary px-2 py-0.5 rounded-md uppercase tracking-wider">Verdura</span>
</button>
<button class="flex items-center gap-2 px-4 py-2.5 bg-surface-container-low hover:bg-surface-container rounded-full transition-all group">
<span class="text-sm font-semibold text-primary">Tomates de pera</span>
<span class="text-[10px] font-bold bg-white text-secondary px-2 py-0.5 rounded-md uppercase tracking-wider">Verdura</span>
</button>
<button class="flex items-center gap-2 px-4 py-2.5 bg-surface-container-low hover:bg-surface-container rounded-full transition-all group">
<span class="text-sm font-semibold text-primary">Salsa de tomate</span>
<span class="text-[10px] font-bold bg-white text-secondary px-2 py-0.5 rounded-md uppercase tracking-wider">Despensa</span>
</button>
</div>
<!-- 3. Duplicate Warning -->
<div class="bg-error-container/40 border border-error/10 p-5 rounded-3xl mb-8 flex flex-col gap-4">
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-error mt-0.5" data-icon="warning" style="font-variation-settings: 'FILL' 1;">warning</span>
<p class="text-sm font-medium text-on-error-container leading-relaxed">
                            Ya tienes <span class="font-bold text-primary">Tomates</span> en la lista. ¿Aumentar cantidad?
                        </p>
</div>
<div class="flex gap-2">
<button class="bg-white px-4 py-2 rounded-xl text-xs font-bold text-primary shadow-sm hover:bg-surface-container transition-colors">Sí, añadir</button>
<button class="px-4 py-2 rounded-xl text-xs font-bold text-on-surface-variant hover:bg-surface-container-low transition-colors">Ignorar</button>
</div>
</div>
<!-- 4. Quantity & Unit Row -->
<div class="grid grid-cols-2 gap-4 mb-8">
<div>
<label class="block text-[11px] font-bold uppercase tracking-[0.1em] text-primary/60 mb-2 ml-1">Cantidad</label>
<div class="flex items-center bg-surface-container-low rounded-2xl px-4 py-3 border border-transparent focus-within:border-primary/20 transition-all">
<input class="w-full bg-transparent border-none focus:ring-0 text-xl font-bold p-0" type="number" value="1"/>
</div>
</div>
<div>
<label class="block text-[11px] font-bold uppercase tracking-[0.1em] text-primary/60 mb-2 ml-1">Unidad</label>
<div class="relative bg-surface-container-low rounded-2xl px-4 py-3 border border-transparent">
<select class="w-full bg-transparent border-none focus:ring-0 text-lg font-bold p-0 appearance-none pr-8">
<option>ud</option>
<option selected="">kg</option>
<option>g</option>
<option>L</option>
<option>ml</option>
<option>pack</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-primary/40">expand_more</span>
</div>
</div>
</div>
<!-- 5. Category Selector -->
<div class="mb-8">
<label class="block text-[11px] font-bold uppercase tracking-[0.1em] text-primary/60 mb-3 ml-1">Categoría</label>
<div class="flex gap-2 overflow-x-auto hide-scrollbar -mx-8 px-8 pb-2">
<button class="whitespace-nowrap px-6 py-3 bg-tertiary text-tertiary-fixed font-bold rounded-2xl border-2 border-tertiary">Frutas</button>
<button class="whitespace-nowrap px-6 py-3 bg-surface-container-low text-primary/70 font-bold rounded-2xl border-2 border-transparent hover:border-surface-variant">Lácteos</button>
<button class="whitespace-nowrap px-6 py-3 bg-surface-container-low text-primary/70 font-bold rounded-2xl border-2 border-transparent hover:border-surface-variant">Carnes</button>
<button class="whitespace-nowrap px-6 py-3 bg-surface-container-low text-primary/70 font-bold rounded-2xl border-2 border-transparent hover:border-surface-variant">Bebidas</button>
<button class="whitespace-nowrap px-6 py-3 bg-surface-container-low text-primary/70 font-bold rounded-2xl border-2 border-transparent hover:border-surface-variant">Limpieza</button>
<button class="whitespace-nowrap px-6 py-3 bg-surface-container-low text-primary/70 font-bold rounded-2xl border-2 border-transparent hover:border-surface-variant">Otros</button>
</div>
</div>
<!-- 6. Estimated Price -->
<div class="mb-10">
<label class="block text-[11px] font-bold uppercase tracking-[0.1em] text-primary/60 mb-2 ml-1">Precio Estimado (Opcional)</label>
<div class="flex items-center bg-surface-container-low rounded-2xl px-5 py-4 border border-transparent focus-within:bg-white focus-within:ring-4 focus-within:ring-secondary/10 transition-all">
<span class="text-xl font-bold text-primary/30 mr-2">€</span>
<input class="w-full bg-transparent border-none focus:ring-0 text-xl font-extrabold text-primary p-0" placeholder="0,00" type="text"/>
</div>
</div>
<!-- 7. Actions -->
<div class="flex flex-col gap-4">
<button class="w-full py-5 bg-gradient-to-r from-primary to-primary-container text-white font-bold text-lg rounded-2xl shadow-xl shadow-primary-container/20 active:scale-[0.98] transition-all">
                        Añadir a la lista
                    </button>
<button class="w-full py-4 text-primary/60 font-bold text-sm hover:text-primary transition-colors">
                        Cancelar
                    </button>
</div>
</div>
</div>
</div>
